<div style="max-width: 350px; margin: 50px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1);">
  <h2 style="margin-top: 0; text-align: center; color: #2563eb;">Secure Login</h2>

  @if (loginError()) {
  <p style="color: #dc2626; font-weight: bold; text-align: center;">{{ loginError() }}</p>
  }

  <form (ngSubmit)="onSubmitLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Username</label>
      <input type="text" [(ngModel)]="username" name="username" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Password</label>
      <input type="password" [(ngModel)]="password" name="password" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required />
    </div>

    <button type="submit" style="width: 100%; background-color: #2563eb; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
      Login
    </button>
  </form>
</div>
