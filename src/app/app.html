@if (currentPage() === 'home') {
<!-- Home Page View -->
<h1>Welcome to My First Angular App!</h1>

<p>You have clicked the button <strong>{{ clickCount() }}</strong> times!</p>
<button (click)="incrementCount()">Click Me!</button>

<hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;" />

<!-- Navigation Button to go to Weather View -->
<button (click)="navigateTo('weather')" style="background-color: #2563eb;">
  Check Paris Weather →
</button>

<app-profile></app-profile>

} @else if (currentPage() === 'weather') {
<!-- Weather Page View -->
<app-weather (goBack)="navigateTo('home')"></app-weather>
}
<app-my-lifecycle-sample></app-my-lifecycle-sample>
